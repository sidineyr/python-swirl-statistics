name: Testes do curso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Verificar execução a partir do código
        run: python -m python_swirl --listar
      - name: Instalar pacote
        run: python -m pip install .
      - name: Verificar JSONs no pacote instalado
        working-directory: ${{ runner.temp }}
        run: python -c "from python_swirl.engine import load_lessons; assert len(load_lessons()) == 3; from python_swirl.__main__ import main; import sys; sys.argv = ['python-swirl', '--listar']; main()"
