name: Testes do curso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Verificar execução a partir do código
        run: python -m python_swirl --listar
      - name: Verificar apresentação web
        run: python scripts/check_site.py
      - name: Verificar cálculos das atividades web
        run: node scripts/test_activities.cjs
      - name: Instalar pacote
        run: python -m pip install .
      - name: Verificar JSONs no pacote instalado
        working-directory: ${{ runner.temp }}
        run: python -c "from python_swirl.engine import load_lessons; assert len(load_lessons()) == 3; from python_swirl.__main__ import main; import sys; sys.argv = ['python-swirl', '--listar']; main()"

  online-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install pandas matplotlib
      - run: npm ci
      - run: python scripts/check_notebooks.py
      - run: npm test
      - run: python scripts/build_course.py
      - run: git diff --exit-code -- site/
